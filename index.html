<title>Prompt Master</title>

<style>
:root{
    --bg:#080a0d;
    --panel:#0e1217;
    --panel2:#121820;
    --border:#303944;
    --gold:#d6b35c;
    --gold-dark:#816b36;
    --text:#f0eee7;
    --muted:#8f98a4;
    --green:#5ed6c9;
    --red:#e87568;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at 80% 0%,rgba(214,179,92,.10),transparent 30%),
        var(--bg);
    color:var(--text);
    font-family:Consolas,"Courier New",monospace;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.header{
    height:74px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    border-bottom:1px solid var(--gold-dark);
    background:#080a0d;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    width:45px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
}

.logo svg{
    width:45px;
    height:40px;
}

.brand-title{
    color:var(--gold);
    font-size:20px;
    font-weight:bold;
    letter-spacing:2px;
}

.brand-subtitle{
    margin-top:2px;
    color:var(--muted);
    font-size:9px;
    letter-spacing:1px;
}

.languages{
    display:flex;
    gap:5px;
}

.lang-btn{
    border:1px solid var(--border);
    background:#0b0f14;
    color:var(--muted);
    padding:7px 10px;
}

.lang-btn.active{
    border-color:var(--gold);
    color:var(--gold);
}

.toolbar{
    display:flex;
    gap:8px;
    padding:9px 28px;
    border-bottom:1px solid var(--border);
    background:#0a0e12;
}

.toolbar button{
    padding:8px 12px;
    background:#0b1015;
    border:1px solid var(--border);
    color:var(--muted);
}

.toolbar button.active{
    color:var(--gold);
    border-color:var(--gold-dark);
}

.layout{
    display:grid;
    grid-template-columns:260px minmax(450px,1fr) minmax(400px,.9fr);
    min-height:calc(100vh - 116px);
}

.sidebar{
    padding:20px;
    border-right:1px solid var(--border);
    background:#090c10;
}

.workspace{
    padding:22px;
    border-right:1px solid var(--border);
}

.preview{
    padding:22px;
    background:#090d11;
}

.section-label{
    color:var(--green);
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:12px;
}

.tool-list{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.tool{
    width:100%;
    text-align:left;
    display:flex;
    gap:10px;
    padding:9px;
    background:transparent;
    border:1px solid transparent;
    color:var(--muted);
}

.tool:hover,
.tool.active{
    color:var(--gold);
    border-color:#655631;
    background:#151a20;
}

.tool-icon{
    width:20px;
    text-align:center;
}

.tool-name{
    font-weight:bold;
    font-size:12px;
}

.tool-description{
    font-size:9px;
    opacity:.75;
    margin-top:2px;
}

h1{
    margin:0;
    color:var(--gold);
    font-size:21px;
    letter-spacing:1px;
}

.description{
    color:var(--muted);
    margin:5px 0 20px;
    font-size:12px;
}

.form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.field.full{
    grid-column:1/-1;
}

label{
    display:block;
    color:#d7c58e;
    font-size:10px;
    font-weight:bold;
    margin-bottom:5px;
    text-transform:uppercase;
}

label span{
    color:var(--muted);
    font-weight:normal;
    text-transform:none;
}

input,
textarea,
select{
    width:100%;
    background:#080c10;
    color:var(--text);
    border:1px solid #38424d;
    padding:10px;
    border-radius:2px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    outline:none;
    border-color:var(--gold);
}

.actions{
    display:flex;
    align-items:center;
    gap:9px;
    margin-top:18px;
}

.primary{
    background:var(--gold);
    color:#17130a;
    border:1px solid var(--gold);
    padding:10px 14px;
    font-weight:bold;
}

.secondary{
    background:transparent;
    color:var(--gold);
    border:1px solid var(--gold-dark);
    padding:10px 14px;
}

.status{
    color:var(--green);
    font-size:10px;
}

.preview-header{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
}

.badge{
    border:1px solid var(--green);
    color:var(--green);
    padding:4px 7px;
    font-size:9px;
}

.strategy{
    color:var(--muted);
    font-size:10px;
    margin:8px 0 14px;
}

.output{
    min-height:520px;
    max-height:calc(100vh - 240px);
    overflow:auto;
    white-space:pre-wrap;
    background:#0c1116;
    border:1px solid #37414c;
    padding:16px;
    color:#eee;
    font-size:11px;
    line-height:1.65;
}

.question-box{
    display:none;
    margin-top:18px;
    border:1px solid var(--gold-dark);
    padding:14px;
    background:#11151a;
}

.question-box.visible{
    display:block;
}

.question-title{
    color:var(--gold);
    font-weight:bold;
    margin-bottom:8px;
}

.question{
    margin-bottom:10px;
}

.question label{
    text-transform:none;
}

.warning{
    color:var(--red);
    font-size:10px;
    margin-top:8px;
}

@media(max-width:1150px){
    .layout{
        grid-template-columns:230px 1fr;
    }

    .preview{
        grid-column:2;
        border-top:1px solid var(--border);
    }
}

@media(max-width:750px){
    .header{
        padding:0 14px;
    }

    .brand-title{
        font-size:16px;
    }

    .toolbar{
        padding:8px 14px;
    }

    .layout{
        display:block;
    }

    .sidebar,
    .workspace{
        border-right:0;
        border-bottom:1px solid var(--border);
    }

    .form{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .output{
        min-height:400px;
    }
}
</style>

const FORBIDDEN = [

];


/* ============================================================
   HELPERS
   ============================================================ */

function getTool(){

    return tools.find(
        tool => tool.id === state.tool
    );

}


function value(key){

    return (
        state.values[state.tool] &&
        state.values[state.tool][key]
    ) || "";

}


function setValue(key,val){

    if(!state.values[state.tool]){
        state.values[state.tool] = {};
    }

    state.values[state.tool][key] = val;

}


function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");

}


/* ============================================================
   RENDER TOOL LIST
   ============================================================ */

function renderTools(){

    const container = document.getElementById("toolList");

    const language = state.language;

    container.innerHTML = tools.map(tool => {

        return `
            <button
                class="tool ${tool.id === state.tool ? "active" : ""}"
                data-tool="${tool.id}"
            >

                <div class="tool-icon">
                    ${tool.icon}
                </div>

                <div>

                    <div class="tool-name">
                        ${tool[language]}
                    </div>

                    <div class="tool-description">
                        ${tool.description}
                    </div>

                </div>

            </button>
        `;

    }).join("");

    document
        .querySelectorAll(".tool")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    state.tool =
                        button.dataset.tool;

                    state.generated = false;

                    render();

                }
            );

        });

}


/* ============================================================
   RENDER FORM
   ============================================================ */

function renderForm(){

    const tool = getTool();

    const language = state.language;

    document.getElementById("workspaceTitle")
        .textContent = tool[language];

    document.getElementById("workspaceDescription")
        .textContent = tool.description;

    const form =
        document.getElementById("form");

    form.innerHTML =
        tool.fields.map(key => {

            const field = fields[key];

            if(!field){
                return "";
            }

            const label =
                field[language];

            const placeholder =
                field.placeholder[language];

            const current =
                value(key);

            const full =
                field.full ? "full" : "";

            if(field.type === "textarea"){

                return `
                    <div class="field ${full}">

                        <label>
                            ${label}
                        </label>

                        <textarea
                            data-field="${key}"
                            placeholder="${escapeHtml(placeholder)}"
                        >${escapeHtml(current)}</textarea>

                    </div>
                `;

            }

            return `
                <div class="field ${full}">

                    <label>
                        ${label}
                    </label>

                    <input
                        data-field="${key}"
                        value="${escapeHtml(current)}"
                        placeholder="${escapeHtml(placeholder)}"
                    >

                </div>
            `;

        }).join("");

    document
        .querySelectorAll("[data-field]")
        .forEach(element => {

            element.addEventListener(
                "input",
                event => {

                    setValue(
                        event.target.dataset.field,
                        event.target.value
                    );

                    state.generated = false;

                    updatePreview();

                }
            );

        });

}


/* ============================================================
   CLARIFYING QUESTION ENGINE
   ============================================================ */

function getQuestions(){

    const questions = [];

    const task = value("task");

    if(!task.trim()){

        questions.push({
            key:"task",
            text:
                state.language === "en"
                ? "What exactly should the AI do?"
                : "Šta tačno AI treba da uradi?"
        });

    }

    const target =
        value("target") ||
        value("model");

    if(
        state.tool === "general" &&
        !target.trim()
    ){

        questions.push({
            key:"target",
            text:
                state.language === "en"
                ? "Which AI tool will receive this prompt?"
                : "Koji AI alat će dobiti ovaj prompt?"
        });

    }

    if(
        ["coding","image","image-edit","video","voice"]
            .includes(state.tool)
        &&
        !value("model").trim()
    ){

        questions.push({
            key:"model",
            text:
                state.language === "en"
                ? "Which exact AI tool/model are you using?"
                : "Koji tačno AI alat/model koristiš?"
        });

    }

    return questions.slice(0,3);

}


function renderQuestions(){

    const questions =
        getQuestions();

    const box =
        document.getElementById("questionBox");

    const container =
        document.getElementById("questions");

    if(!questions.length){

        box.classList.remove("visible");

        container.innerHTML = "";

        return;

    }

    box.classList.add("visible");

    container.innerHTML =
        questions.map(q => {

            const field =
                fields[q.key];

            const placeholder =
                field
                ? field.placeholder[state.language]
                : "";

            return `
                <div class="question">

                    <label>
                        ${q.text}
                    </label>

                    <input
                        data-question="${q.key}"
                        placeholder="${escapeHtml(placeholder)}"
                    >

                </div>
            `;

        }).join("");

}

function addLine(lines,key,title){

    const val =
        value(key).trim();

    if(val){

        lines.push(

        );

    }

}

/* ============================================================

   ============================================================ */

function updatePreview(){

    const output =
        document.getElementById("output");

    const tool =
        getTool();

    document.getElementById("toolBadge")
        .textContent =
            (value("model") ||
             value("target") ||
             tool[state.language])
            .toUpperCase();

    document.getElementById("strategy")
        .textContent =
            UI[state.language].strategy;

    if(!state.generated){

        output.textContent =
            UI[state.language].noPrompt;

        return;

    }

    output.textContent =
        buildPrompt();

}


/* ============================================================
   GENERATE
   ============================================================ */

function generate(){

    const questions =
        getQuestions();

    if(questions.length){

        renderQuestions();

        document.getElementById("status")
            .textContent =
                state.language === "en"
                ? "Answer the required questions."
                : "Odgovori na obavezna pitanja.";

        return;

    }

    state.generated = true;

    document.getElementById("questionBox")
        .classList.remove("visible");

    updatePreview();

}

   RENDER
   ============================================================ */

function render(){

    renderTools();

    renderForm();

    renderQuestions();

    updatePreview();

}


/* ============================================================
   CLEAR
   ============================================================ */

document
    .getElementById("clearButton")
    .addEventListener(
        "click",
        () => {

            state.values[state.tool] = {};

            state.generated = false;

            document.getElementById("status")
                .textContent = "";

            render();

        }
    );


/* ============================================================
   GENERATE BUTTON
   ============================================================ */

document
    .getElementById("generateButton")
    .addEventListener(
        "click",
        generate
    );


/* ============================================================
   COPY
   ============================================================ */

document
    .getElementById("copyButton")
    .addEventListener(
        "click",
        async () => {

            if(!state.generated){

                generate();

            }

            if(!state.generated){
                return;
            }

            try{

                await navigator.clipboard.writeText(
                    buildPrompt()
                );

                document.getElementById("status")
                    .textContent =
                        UI[state.language].copied;

            }
            catch(error){

                document.getElementById("status")
                    .textContent =
                        "Clipboard unavailable.";

            }

        }
    );


/* ============================================================
   DOWNLOAD
   ============================================================ */

document
    .getElementById("downloadButton")
    .addEventListener(
        "click",
        () => {

            if(!state.generated){

                generate();

            }

            if(!state.generated){
                return;
            }

            const blob =
                new Blob(
                    [buildPrompt()],
                    {
                        type:
                            "text/plain;charset=utf-8"
                    }
                );

            const url =
                URL.createObjectURL(blob);

            const anchor =
                document.createElement("a");

            anchor.href =
                url;

            anchor.download =
                "prompt-master.txt";

            document.body.appendChild(anchor);

            anchor.click();

            anchor.remove();

            URL.revokeObjectURL(url);

            document.getElementById("status")
                .textContent =
                    UI[state.language].downloaded;

        }
    );


/* ============================================================
   LANGUAGE BUTTONS
   ============================================================ */

document
    .querySelectorAll(".lang-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                changeLanguage(
                    button.dataset.language
                );

            }
        );

    });


/* ============================================================
   INITIALIZE
   ============================================================ */

render();

</script>

</body>
</html>
