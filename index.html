<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CikaDule – Prompt Master Neural Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #03020a;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* AI Background */
    .ai-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: 
        radial-gradient(ellipse at 50% 40%, rgba(88, 28, 135, 0.3) 0%, transparent 60%),
        radial-gradient(ellipse at 30% 60%, rgba(15, 23, 82, 0.5) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 30%, rgba(6, 78, 130, 0.3) 0%, transparent 50%);
      background-color: #03020a;
      z-index: -1;
    }

    .ai-background::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://images.unsplash.com/photo-1677442136019-21780ecad995?w=1440&q=80') center/cover no-repeat;
      opacity: 0.15;
      mix-blend-mode: screen;
    }

    /* Header */
    .header {
      position: sticky;
      top: 20px;
      max-width: 1200px;
      margin: 20px auto 0;
      padding: 16px 28px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .eagle-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
      border-radius: 50%;
      background: #111;
      padding: 2px;
      border: 1px solid rgba(255, 215, 0, 0.4);
    }

    .brand-name {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .status-badge {
      background: rgba(0, 0, 0, 0.25);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #22c55e;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(34, 197, 94, 0.2);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* App Container Layout */
    .app-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    @media (max-width: 900px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    h2, h3 {
      color: #fff;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: rgba(163, 163, 194, 0.9);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    select, input, textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    select:focus, input:focus, textarea:focus {
      border-color: #ffd700;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.2);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .glass-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid #ffd700;
      color: #ffd700;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(255, 215, 0, 0.1);
      margin-top: 10px;
    }

    .glass-btn:hover {
      background: rgba(255, 215, 0, 0.2);
      box-shadow: 0 4px 24px rgba(255, 215, 0, 0.3);
      transform: translateY(-1px);
    }

    /* Output Section */
    .output-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #e2e8f0;
      white-space: pre-wrap;
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .meta-info {
      font-size: 13px;
      color: #ffd700;
      margin-bottom: 10px;
      font-family: 'JetBrains Mono', monospace;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Footer */
    .footer {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: rgba(163, 163, 194, 0.5);
      letter-spacing: 1px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="ai-background"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <img src="orao.png.png" alt="CikaDule Logo" class="eagle-logo">
      <span class="brand-name">By CikaDule</span>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      PROMPT MASTER ACTIVE
    </div>
  </header>

  <!-- Main App Interface -->
  <div class="app-container">
    <!-- Configuration Panel -->
    <div class="glass-panel">
      <h2>Prompt Configuration</h2>
      
      <div class="form-group">
        <label for="toolSelect">Target Tool / Category</label>
        <select id="toolSelect" onchange="renderDynamicFields()">
          <option value="claude">Claude (3.5 / 4.x)</option>
          <option value="chatgpt">ChatGPT / GPT-4o</option>
          <option value="gemini">Gemini 2.x / 3 Pro</option>
          <option value="o1">OpenAI Reasoning (o1 / o3 / R1)</option>
          <option value="qwen">Qwen 2.5 / Qwen3</option>
          <option value="ollama">Ollama (Local Deployment)</option>
          <option value="llama">Llama / Mistral Open-Weight</option>
          <option value="deepseek">DeepSeek Reasoning</option>
          <option value="claude-code">Claude Code Agent</option>
          <option value="antigravity">Antigravity IDE</option>
          <option value="cursor">Cursor / Windsurf IDE</option>
          <option value="copilot">GitHub Copilot</option>
          <option value="bolt">Bolt / v0 / Lovable</option>
          <option value="devin">Devin / SWE-agent</option>
          <option value="perplexity">Perplexity / SearchGPT</option>
          <option value="image">Image AI Generation</option>
          <option value="image-edit">Image Reference Editing</option>
          <option value="comfyui">ComfyUI Node Pipeline</option>
          <option value="video">Video AI (Sora/Runway/Kling)</option>
          <option value="voice">Voice AI (ElevenLabs/Murf)</option>
          <option value="workflow">Workflow AI (Zapier/n8n)</option>
          <option value="decompiler">Prompt Decompiler Mode</option>
        </select>
      </div>

      <!-- Dynamic Form Fields Container -->
      <div id="dynamicFields"></div>

      <button class="glass-btn" onclick="generatePrompt()">⚡ Generate Optimized Prompt</button>
    </div>

    <!-- Output Panel -->
    <div class="glass-panel">
      <h2>Neural Output</h2>
      
      <div class="form-group">
        <label>Optimized Copyable Prompt</label>
        <div id="outputPrompt" class="output-box">// Čekanje na unos parametara...</div>
        <button class="copy-btn" onclick="copyPrompt()">📋 Kopiraj Prompt</button>
      </div>

      <div style="margin-top: 20px;">
        <div id="outputTarget" class="meta-info">🎯 Target: -</div>
        <div id="outputStrategy" class="meta-info" style="color: rgba(255,255,255,0.7);">💡 Strategy: -</div>
      </div>
    </div>
  </div>

  <footer class="footer">
    CIKADULE NEURAL ARCHITECTURE © 2026 — SECURE PROMPT-MASTER ENGINE
  </footer>

  <script>
    // Dinamička polja za sve originalne alate sa ispravljenim nedostajućim "task" poljima (popravljen bug sa 6 slomljenih alata)
    const toolFields = {
      'coding': [
        { id: 'task', label: 'Task / Coding Objective', type: 'text', placeholder: 'Npr. Refaktoriši login servis...' },
        { id: 'language', label: 'Language & Framework', type: 'text', placeholder: 'Npr. TypeScript, Node.js' },
        { id: 'constraints', label: 'Scope Constraints / Do-Not-Touch', type: 'textarea', placeholder: 'Npr. Ne diraj bazu podataka...' }
      ],
      'image': [
        { id: 'task', label: 'Image Subject / Scene Description', type: 'textarea', placeholder: 'Npr. Futuristički grad u neon svetlima...' },
        { id: 'style', label: 'Art Style / Aesthetic', type: 'text', placeholder: 'Npr. Cyberpunk, cinematic lighting' },
        { id: 'params', label: 'Parameters / Aspect Ratio', type: 'text', placeholder: 'Npr. --ar 16:9 --v 6' }
      ],
      'image-edit': [
        { id: 'task', label: 'Editing Modification Goal', type: 'textarea', placeholder: 'Npr. Promeni boju automobila u crvenu...' },
        { id: 'change', label: 'Delta / Šta se menja, šta ostaje', type: 'text', placeholder: 'Zadrži pozadinu, promeni samo objekat' }
      ],
      'video': [
        { id: 'task', label: 'Video Scene & Camera Movement', type: 'textarea', placeholder: 'Npr. Drone shot, let iznad planine...' },
        { id: 'duration', label: 'Duration & Mood', type: 'text', placeholder: 'Npr. 5 sekundi, dramatična atmosfera' }
      ],
      'voice': [
        { id: 'task', label: 'Voice Narration Script / Content', type: 'textarea', placeholder: 'Tekst koji se izgovara...' },
        { id: 'emotion', label: 'Emotion & Pacing', type: 'text', placeholder: 'Npr. Smireno, profesionalno, sporiji tempo' }
      ],
      'workflow': [
        { id: 'task', label: 'Workflow Automatski Zadatak', type: 'textarea', placeholder: 'Npr. Poveži Gmail i Trello...' },
        { id: 'trigger', label: 'Trigger & Action Apps', type: 'text', placeholder: 'Npr. New Email -> Create Card' }
      ],
      'default': [
        { id: 'task', label: 'Glavni zadatak / Task', type: 'textarea', placeholder: 'Opiši šta želiš da AI uradi...' },
        { id: 'outputFormat', label: 'Željeni format izlaza', type: 'text', placeholder: 'Npr. JSON, tabela, markdown...' },
        { id: 'constraints', label: 'Posebna pravila / Ograničenja', type: 'text', placeholder: 'Npr. Budi koncizan, bez uvoda...' }
      ]
    };

    function renderDynamicFields() {
      const tool = document.getElementById('toolSelect').value;
      const container = document.getElementById('dynamicFields');
      container.innerHTML = '';

      const fields = toolFields[tool] || toolFields['default'];
      fields.forEach(f => {
        const div = document.createElement('div');
        div.className = 'form-group';
        
        const label = document.createElement('label');
        label.innerText = f.label;
        div.appendChild(label);

        if (f.type === 'textarea') {
          const ta = document.createElement('textarea');
          ta.id = f.id;
          ta.placeholder = f.placeholder;
          div.appendChild(ta);
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.id = f.id;
          input.placeholder = f.placeholder;
          div.appendChild(input);
        }
        container.appendChild(div);
      });
    }

    function generatePrompt() {
      const tool = document.getElementById('toolSelect').value;
      const fields = toolFields[tool] || toolFields['default'];
      
      let data = {};
      let missingTask = false;

      fields.forEach(f => {
        const el = document.getElementById(f.id);
        if (el) data[f.id] = el.value.trim();
      });

      // Sigurnosna provera: Automatsko mapiranje ukoliko je task prazan a unet je neki drugi opis
      if (!data['task']) {
        for (let key in data) {
          if (data[key] && key !== 'task') {
            data['task'] = data[key];
            break;
          }
        }
      }

      if (!data['task']) {
        alert('Molimo popunite obavezna polja pre generisanja!');
        return;
      }

      // Generisanje produkcijskog prompte bazirano na skill.md pravilima
      let generatedPrompt = `## Context & Instructions\n- Task: ${data['task']}\n`;
      if (data['language']) generatedPrompt += `- Stack/Language: ${data['language']}\n`;
      if (data['style']) generatedPrompt += `- Style/Aesthetic: ${data['style']}\n`;
      if (data['constraints']) generatedPrompt += `- Constraints: ${data['constraints']}\n`;
      if (data['outputFormat']) generatedPrompt += `- Output Format: ${data['outputFormat']}\n`;
      
      generatedPrompt += `\nExecute directly with zero preamble. Keep solutions minimal and precise.`;

      document.getElementById('outputPrompt').innerText = generatedPrompt;
      document.getElementById('outputTarget').innerText = `🎯 Target: ${tool.toUpperCase()}`;
      document.getElementById('outputStrategy').innerText = `💡 Strategy: Optimized for token efficiency, explicit constraint ordering, and zero filler.`;
    }

    function copyPrompt() {
      const text = document.getElementById('outputPrompt').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert('Prompt je uspešno kopiran u klipbord!');
      });
    }

    // Inicijalno renderovanje polja pri učitavanju
    window.onload = renderDynamicFields;
  </script>
</body>
</html>
