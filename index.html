<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON//CONTEXT</title>
<style>
:root{
    --bg:#05070b;
    --panel:rgba(13, 17, 23, 0.75);
    --panel2:rgba(20, 25, 20, 0.85);
    --line:rgba(255, 230, 0, 0.15);
    --yellow:#ffe600;
    --yellow2:#b9ad20;
    --text:#fff7b0;
    --muted:#9aa0a6;
    --pink:#ff3ec8;
    --cyan:#40ffd8;
    --danger:#ff826e;
    --glass-blur: blur(12px);
    --border-radius: 14px;
}
*{box-sizing:border-box}
body{
    margin:0;
    background-color: var(--bg);
    color:var(--text);
    font:14px/1.45 Consolas,"Courier New",monospace;
    min-height:100vh;
    position: relative;
}
/* IT Mrežna pozadina */
body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
    background-image: 
        radial-gradient(circle at 20% 30%, rgba(255, 230, 0, 0.04) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 240, 255, 0.03) 0%, transparent 40%),
        linear-gradient(to right, rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
}
button,input,textarea,select{font:inherit}

/* Header */
.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 28px;
    border-bottom:1px solid var(--line);
    background: var(--panel);
    backdrop-filter: var(--glass-blur);
    position:sticky;
    top:0;
    z-index:2;
}

/* Levi deo headera (Brending sa logoom i imenom) */
.header-left {
    display: flex;
    align-items: center;
    gap: 15px;
}
.cika-dule-branding {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 230, 0, 0.05);
    border: 1px solid rgba(255, 230, 0, 0.2);
    padding: 5px 10px;
    border-radius: 20px;
    backdrop-filter: blur(8px);
}
.cika-dule-branding img {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    object-fit: cover;
}
.cika-dule-branding span {
    font-size: 11px;
    color: var(--yellow);
    font-weight: bold;
    letter-spacing: 0.05em;
}

.brand{
    font-size:18px;
    font-weight:bold;
    letter-spacing:.09em;
    color:var(--yellow);
    text-shadow:0 0 12px rgba(255, 230, 0, 0.3);
}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.04em;margin-top:2px}

.lang{display:flex;gap:5px}
.lang button,.nav button{
    background:rgba(255, 255, 255, 0.02);
    color:var(--muted);
    border:1px solid var(--line);
    padding:8px 11px;
    cursor:pointer;
    border-radius: 8px;
    transition: all 0.2s ease;
}
.lang button.on,.nav button.on{
    border-color:var(--yellow);
    color:var(--yellow);
    background: rgba(255, 230, 0, 0.08);
    box-shadow:0 0 12px rgba(255, 230, 0, 0.2);
}
.nav{
    display:flex;
    gap:8px;
    padding:10px 28px;
    border-bottom:1px solid var(--line);
    background: rgba(8, 11, 9, 0.8);
    backdrop-filter: var(--glass-blur);
    overflow:auto;
}
.app{
    display:grid;
    grid-template-columns:258px minmax(460px,1fr) minmax(360px,.8fr);
    min-height:calc(100vh - 119px);
}
aside,.editor,.preview{padding:22px}
aside,.editor{border-right:1px solid var(--line)}
aside{background:rgba(8, 11, 9, 0.6); backdrop-filter: var(--glass-blur);}
.editor{background:rgba(14,17,14,0.75); backdrop-filter: var(--glass-blur);}
.preview{background:rgba(8, 11, 9, 0.6); backdrop-filter: var(--glass-blur);}

.eyebrow{font-size:10px;color:var(--cyan);letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px}
.types{display:grid;gap:5px}
.type{
    display:flex;
    gap:9px;
    align-items:center;
    text-align:left;
    color:var(--muted);
    background:transparent;
    border:1px solid transparent;
    padding:9px;
    cursor:pointer;
    border-radius: 8px;
    transition: all 0.2s;
}
.type strong{display:block;font-size:12px;color:inherit}
.type span:last-child{display:block;font-size:10px;opacity:.8}
.type:hover,.type.on{
    background:rgba(255, 230, 0, 0.08);
    color:var(--yellow);
    border-color:rgba(255, 230, 0, 0.3);
    box-shadow: inset 3px 0 var(--yellow);
}
h1{font-size:21px;margin:0 0 4px;color:var(--yellow);letter-spacing:.04em}
.intro,.help{color:var(--muted);margin:0 0 18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.full{grid-column:1/-1}
label{display:block;color:var(--yellow);font-size:11px;font-weight:bold;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
label small{color:var(--muted);text-transform:none;font-weight:normal}
input,textarea,select{
    width:100%;
    border:1px solid rgba(255, 230, 0, 0.2);
    background:rgba(0, 0, 0, 0.4);
    color:var(--text);
    border-radius:8px;
    padding:10px;
}
textarea{resize:vertical;min-height:86px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--yellow);box-shadow:0 0 10px rgba(255, 230, 0, 0.2)}
select option{background:#11160e; color: var(--yellow);}

/* Staklena dugmad sa mekanim ivicama */
.actions{display:flex;gap:10px;align-items:center;margin-top:18px}
.primary,.secondary{
    border:1px solid rgba(255, 230, 0, 0.4);
    font-weight:bold;
    padding:10px 16px;
    cursor:pointer;
    border-radius: 12px;
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
}
.primary{
    background:rgba(255, 230, 0, 0.12);
    color:var(--yellow);
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
.primary:hover{
    background:rgba(255, 230, 0, 0.25);
    border-color:var(--yellow);
    box-shadow:0 0 20px rgba(255, 230, 0, 0.3);
    transform: translateY(-2px);
}
.secondary{
    background:rgba(255, 255, 255, 0.03);
    color:var(--muted);
    border-color:rgba(255, 255, 255, 0.1);
}
.secondary:hover{
    background:rgba(255, 255, 255, 0.08);
    color:var(--yellow);
    border-color:rgba(255, 230, 0, 0.3);
}
#status{color:var(--cyan);font-size:11px}
.previewHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.badge{font-size:10px;border:1px solid var(--cyan);color:var(--cyan);padding:4px 6px;border-radius:6px}
.note{color:var(--muted);font-size:11px}
.output{
    white-space:pre-wrap;
    overflow:auto;
    max-height:calc(100vh - 255px);
    min-height:510px;
    border:1px solid rgba(255, 230, 0, 0.2);
    background:rgba(0, 0, 0, 0.6);
    border-radius: 10px;
    padding:15px;
    color:#fff8bd;
    font:12px/1.6 Consolas,"Courier New",monospace;
}
.output:before{content:"// READY_TO_PASTE";display:block;color:var(--pink);font-size:10px;margin-bottom:10px}
.empty{color:var(--muted);border:1px dashed var(--line);padding:14px}

@media(max-width:1100px){
    .app{grid-template-columns:240px 1fr}
    .preview{grid-column:2;border-top:1px solid var(--line)}
    .output{max-height:420px}
}
@media(max-width:720px){
    .top,.nav{padding-left:14px;padding-right:14px}
    .brand{font-size:15px}
    .app{display:block}
    .types{grid-template-columns:1fr 1fr}
    aside,.editor{border-right:0;border-bottom:1px solid var(--line)}
    aside,.editor,.preview{padding:16px}
    .form{grid-template-columns:1fr}
    .full{grid-column:auto}
    .output{min-height:380px}
}
</style>
</head>

function esc(s){return s.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}function title(key){return label[key]?.[lang==='en'?0:1]||key}
function renderTypes(){const el=hex('types');el.innerHTML=Object.entries(specs).map(([k,s])=>'<button class="type '+(k===active?'on':'')+'" data-type="'+k+'"><b>'+s.icon+'</b><div><strong>'+s.name[lang==='en'?0:1]+'</strong><span>'+s.desc[lang==='en'?0:1]+'</span></div></button>').join('');el.querySelectorAll('.type').forEach(b=>b.onclick=()=>{active=b.dataset.type;render()})}
function input([key,kind,def]){let control;const ph=placeholder[key]?.[lang==='en'?0:1]||'';if(kind==='textarea')control='<textarea id="f-'+key+'" placeholder="'+esc(ph)+'">'+esc(data[active]?.[key]??'')+'</textarea>';else if(kind==='select')control='<select id="f-'+key+'">'+selects[key].map(([v,n])=>'<option value="'+v+'" '+((data[active]?.[key]??def)===v?'selected':'')+'>'+n+'</option>').join('')+'</select>';else control='<input id="f-'+key+'" value="'+esc(data[active]?.[key]??'')+'" placeholder="'+esc(ph)+'">';return '<div class="'+(['task','context','current','desired','constraints','success','examples','environment','sources','mapping','original','stop'].includes(key)?'full':'')+'"><label>'+title(key)+(def?'<small> · '+esc(def)+'</small>':'')+'</label>'+control+'</div>'}
function renderFields(){const s=specs[active];hex('formTitle').textContent=s.name[lang==='en'?0:1];hex('formIntro').textContent=s.desc[lang==='en'?0:1];hex('fields').innerHTML=s.fields.map(input).join('');hex('fields').querySelectorAll('input,textarea,select').forEach(el=>el.addEventListener('input',()=>{data[active]??={};data[active][el.id.slice(2)]=el.value;build()}))}
function val(k){return String(data[active]?.[k]??hex('f-'+k)?.value??'').trim()}const row=(k,n=k)=>val(k)?n+': '+val(k):'';function examples(){return val('examples')?'<examples>\n'+val('examples').split('\n').filter(Boolean).map((x,i)=>'  <example id="'+(i+1)+'">'+x+'</example>').join('\n')+'\n</examples>':''}
function modelRule(m){return {gpt:'Use a strong role, numbered instructions, numeric limits, and exact output format. Skip preamble. No caveats. Answer directly.',reasoning:'Use a short direct instruction. Solve internally and output only the final answer. Do not show reasoning.',claude:'Use the tagged sections faithfully. Keep solutions minimal. Only make changes directly requested.',gemini:'Base the response only on supplied context. Cite only sources you are certain of. Mark uncertainty as [uncertain].',qwen:'Use a clear role and explicit output format. Keep the prompt focused and state output language.',qwenThinking:'Use a short direct instruction. Reason internally and output only the final answer.',deepseek:'Use a short direct instruction. Output only the final answer, without reasoning or think tags.',ollama:'Use a simple flat prompt. The selected local model must be specified before use.',local:'Use a short flat prompt with a clear role. Avoid deep nesting and complex multi-step instructions.',claudeCode:'Follow the agent scope, forbidden actions, stop conditions, and checkpoints exactly.',cursor:'Edit only the stated file and component. Preserve all listed contracts. Stop when Done When is met.',copilot:'Write the requested function contract, types, edge cases, and forbidden behavior as a focused instruction.',bolt:'Build only the named deliverable. Do not add authentication, dark mode, or unrequested features.',devin:'Respect explicit starting state, target state, forbidden actions, and stop conditions.',perplexity:'Use the requested research mode. Report only what verified results support and cite every factual claim.',midjourney:'Return comma-separated visual descriptors. Subject first; style, mood, lighting, composition next; parameters last.',dalle:'Use a clear prose image description. Describe foreground, midground, background; exclude text unless requested.',stable:'Use weighted prompt syntax when useful and always include a separate negative prompt.',comfy:'Return separate POSITIVE PROMPT and NEGATIVE PROMPT blocks, plus checkpoint and generation settings.',sora:'Specify subject, camera movement, duration, mood, and cut style.',voice:'Specify emotion, pacing, emphasis, pauses, and speech rate.',zapier:'Return numbered trigger-to-action steps and explicit field mapping.'}[m]||''}
function build(){let m=val('model')||'gpt',task=val('task')||val('desired')||val('subject')||'[Describe the task]';let a=[];if(active==='coding')a=['File: '+val('file'),'Function/Component: [specify if applicable]','Current Behavior: '+val('current'),'Desired Change: '+val('desired'),'Scope: '+val('scope'),'Do NOT touch: '+val('dont'),'Constraints: '+val('constraints'),'Done When: '+val('success')].filter(Boolean);else if(active==='agent')a=['## Objective\n'+task,'## Environment\n'+val('environment'),'## Starting State\n'+val('current'),'## Target State\n'+val('desired'),'## Allowed Actions\n'+val('scope'),'## Forbidden Actions\n'+val('dont'),'## Stop Conditions\n'+val('stop'),'## Checkpoints\nAfter each major step output: ✅ [what was completed].','## Done When\n'+val('success')].filter(Boolean);else if(active==='image')a=[val('subject'),val('action'),val('setting'),val('style'),val('mood'),val('lighting'),val('palette'),val('composition'),'--ar '+val('aspect'),val('negative')?'--no '+val('negative'):''].filter(Boolean);else if(active==='imageEdit')a=['Reference image: '+val('reference'),'What to change: '+val('change'),'What to keep exactly the same: '+val('constraints'),'Negative prompt: '+val('negative')].filter(Boolean);else if(active==='comfy')a=['POSITIVE PROMPT:\n'+[val('subject'),val('style'),val('mood'),val('lighting'),val('composition')].filter(Boolean).join(', '),'NEGATIVE PROMPT:\n'+val('negative'),'CHECKPOINT: '+val('checkpoint'),'RESOLUTION: '+val('aspect'),'SAMPLER: Euler a\nCFG SCALE: 7\nSTEPS: 20-30'];else if(active==='video')a=[val('subject'),val('action'),val('setting'),'Camera: '+val('camera'),'Duration: '+val('duration'),'Mood: '+val('mood'),'Lighting: '+val('lighting'),'Cut style: '+val('cut'),'Aspect ratio: '+val('aspect')].filter(Boolean);else if(active==='workflow')a=['Trigger: '+val('trigger'),'Action: '+val('actionapp'),'Data mapping: '+val('mapping'),'Constraints: '+val('constraints'),'Done when: '+val('success')].filter(Boolean);else if(active==='decompiler')a=['Original prompt:\n'+val('original'),'Operation: '+val('operation'),'Task: '+task,'Output format: '+val('format')].filter(Boolean);else a=[row('role','Role'),row('context','Context'),row('audience','Audience'),'Task: '+task,row('steps','Steps'),row('tone','Tone'),row('constraints','Constraints'),row('sources','Sources'),row('success','Success criteria'),'Output language: '+val('answer'),'Output format: '+val('format'),'Maximum length: '+val('length'),examples()].filter(Boolean);
if(active==='analysis'&&!['reasoning','qwenThinking','deepseek'].includes(m))a.splice(1,0,'Analyze the problem carefully before answering.');if(active==='research')a.push('Use only verified information from the approved sources. If a claim is uncertain, write [uncertain].');let out;if(m==='claude'&&!['image','comfy'].includes(active))out='<role>'+esc(val('role')||'Expert assistant')+'</role>\n<task>'+esc(task)+'</task>\n<context>'+esc(val('context'))+'</context>\n<constraints>'+esc(val('constraints')+'\nOutput format: '+val('format')+'\nMaximum length: '+val('length'))+'</constraints>\n<output_format>'+esc(val('success')||val('format'))+'</output_format>\n'+examples();else out=[modelRule(m),'',...a].filter(Boolean).join('\n\n');hex('output').textContent=out;hex('modelBadge').textContent=models[m]||m;hex('note').textContent='Profile: '+(active==='analysis'&&['reasoning','qwenThinking','deepseek'].includes(m)?'Reasoning-safe — no explicit chain-of-thought.':models[m]||m)}
function render(){renderTypes();renderFields();build()}function setLang(l){lang=l;let q=L[l];hex('tagline').textContent=q.tag;hex('clearT').textContent=q.clear;hex('typeT').textContent=q.type;hex('modeT').textContent=q.mode;hex('copyT').textContent=q.copy;hex('downloadT').textContent=q.down;hex('previewT').textContent=q.prev;hex('previewH').textContent=q.opt;document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('on',x.dataset.lang===l));render()}
hex('copy').onclick=async()=>{await navigator.clipboard.writeText(hex('output').textContent);hex('status').textContent=L[lang].copied};hex('download').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([hex('output'].textContent],{type:'text/plain'}));a.download='optimized-prompt.txt';a.click();hex('status').textContent=L[lang].downloaded};hex('clear').onclick=()=>{data[active]={};hex('status').textContent='';render()};document.querySelectorAll('[data-lang]').forEach(x=>x.onclick=()=>setLang(x.dataset.lang));render();
</script></body></html>
