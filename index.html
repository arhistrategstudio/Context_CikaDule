<style>

n-items:center;text-align:left;color:var(--muted);background:transparent;border:1px solid transparent;padding:9px;cursor:pointer}.type strong{display:block;font-size:12px;color:inherit}.type span:last-child{display:block;font-size:10px;opacity:.8}.type:hover,.type.on{background:#171b10;color:var(--yellow);border-color:#6c6716;box-shadow:inset 3px 0 var(--pink)}h1{font-size:21px;margin:0 0 4px;color:var(--yellow);letter-spacing:.04em}.intro,.help{color:var(--muted);margin:0 0 18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}label{display:block;color:#f3e978;font-size:11px;font-weight:bold;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}label small{color:var(--muted);text-transform:none;font-weight:normal}input,textarea,select{width:100%;border:1px solid #4a512e;background:#090c0a;color:var(--text);border-radius:0;padding:10px}textarea{resize:vertical;min-height:86px}input:focus,textarea:focus,select:focus{outline:none;border-color:var(--yellow);box-shadow:0 0 0 2px #e9dc331c}select option{background:#11160e}.actions{display:flex;gap:10px;align-items:center;margin-top:18px}.primary,.secondary{border:1px solid var(--yellow);font-weight:bold;padding:10px 13px;cursor:pointer;background:var(--yellow);color:#111400;box-shadow:4px 4px 0 #a0177c}.primary:hover{box-shadow:0 0 16px var(--yellow),4px 4px 0 #a0177c}.secondary{background:transparent;color:var(--yellow);border-color:var(--yellow2);box-shadow:none}.secondary:hover{border-color:var(--cyan);color:var(--cyan)}#status{color:var(--cyan);font-size:11px}.previewHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.badge{font-size:10px;border:1px solid var(--cyan);color:var(--cyan);padding:4px 6px}.note{color:var(--muted);font-size:11px}.output{white-space:pre-wrap;overflow:auto;max-height:calc(100vh - 255px);min-height:510px;border:1px solid #474b25;background:linear-gradient(135deg,#10130d,#080a08);padding:15px;color:#fff8bd;font:12px/1.6 Consolas,"Courier New",monospace}.output:before{content:"// READY_TO_PASTE";display:block;color:var(--pink);font-size:10px;margin-bottom:10px}.empty{color:var(--muted);border:1px dashed var(--line);padding:14px}@media(max-width:1100px){.app{grid-template-columns:240px 1fr}.preview{grid-column:2;border-top:1px solid var(--line)}.output{max-height:420px}}@media(max-width:720px){.top,.nav{padding-left:14px;padding-right:14px}.brand{font-size:16px}.app{display:block}.types{grid-template-columns:1fr 1fr}aside,.editor{border-right:0;border-bottom:1px solid var(--line)}aside,.editor,.preview{padding:16px}.form{grid-template-columns:1fr}.full{grid-column:auto}.output{min-height:380px}}
</style></head><body>
<header class="top"><div class="brand">NEON//CONTEXT<small id="tagline">PROMPT ENGINEERING CONSOLE · MODEL-AWARE</small></div><div class="lang"><button class="on" data-lang="en">EN</button><button data-lang="sr">SR</button></div></header>
<nav class="nav"><button class="on" id="navBuilder">▣ CONTEXT BUILDER</button><button id="clear">↺ <span id="clearT">CLEAR ACTIVE FORM</span></button></nav>
<main class="app"><aside><p class="eyebrow" id="typeT">Context type / template</p><div class="types" id="types"></div></aside>
<section class="editor"><p class="eyebrow" id="modeT">ACTIVE WORKSPACE</p><h1 id="formTitle"></h1><p class="intro" id="formIntro"></p><div class="form" id="fields"></div><div class="actions"><button class="primary" id="copy">▣ <span id="copyT">COPY PROMPT</span></button><button class="secondary" id="download">↓ <span id="downloadT">DOWNLOAD .TXT</span></button><span id="status"></span></div></section>
<section class="preview"><div class="previewHead"><div><p class="eyebrow" id="previewT">LIVE PROMPT PREVIEW</p><h1 id="previewH">Optimized prompt</h1></div><span class="badge" id="modelBadge"></span></div><p class="note" id="note"></p><div class="output" id="output"></div></section></main>
<script>
const $=x=>document.getElementById(x), data={};let active='general',lang='en';
const L={en:{tag:'PROMPT ENGINEERING CONSOLE · MODEL-AWARE',clear:'CLEAR ACTIVE FORM',type:'Context type / template',mode:'ACTIVE WORKSPACE',copy:'COPY PROMPT',down:'DOWNLOAD .TXT',prev:'LIVE PROMPT PREVIEW',opt:'Optimized prompt',copied:'Prompt copied.',downloaded:'File downloaded.'},sr:{tag:'PROMPT ENGINEERING KONZOLA · PRILAGOĐENA MODELU',clear:'OČISTI AKTIVNI OBRAZAC',type:'Tip konteksta / šablon',mode:'AKTIVNI RADNI PROSTOR',copy:'KOPIRAJ PROMPT',down:'PREUZMI .TXT',prev:'PREGLED PROMPTA UŽIVO',opt:'Optimizovani prompt',copied:'Prompt je kopiran.',downloaded:'Fajl je preuzet.'}};
const label={model:['Target model','Ciljani model'],answer:['Answer language','Jezik odgovora'],task:['Task / objective','Zadatak / cilj'],role:['Role / expertise','Uloga / stručnost'],context:['Context / background','Kontekst / pozadina'],audience:['Audience','Publika'],format:['Output format','Format izlaza'],length:['Maximum length','Maksimalna dužina'],tone:['Tone / style','Ton / stil'],constraints:['Constraints','Ograničenja'],success:['Done when / success criteria','Uspeh / završeno kada'],steps:['Required steps','Obavezni koraci'],examples:['Examples: one per line as INPUT => OUTPUT','Primeri: jedan po redu kao ULAZ => IZLAZ'],file:['File path / component','Putanja fajla / komponenta'],current:['Current behavior / starting state','Trenutno ponašanje / početno stanje'],desired:['Desired change / target state','Željena izmena / ciljno stanje'],scope:['Allowed scope','Dozvoljeni opseg'],dont:['Do not touch / forbidden actions','Ne diraj / zabranjene radnje'],stop:['Stop conditions','Uslovi za zaustavljanje'],environment:['Environment: OS, shell, folder, tools','Okruženje: OS, shell, folder, alati'],subject:['Subject','Subjekat'],action:['Action / pose','Radnja / poza'],setting:['Setting','Okruženje'],style:['Visual style','Vizuelni stil'],mood:['Mood','Raspoloženje'],lighting:['Lighting','Osvetljenje'],palette:['Color palette','Paleta boja'],composition:['Composition / camera','Kompozicija / kamera'],aspect:['Aspect ratio','Odnos stranica'],negative:['Negative prompt','Negativni prompt'],reference:['Reference image / what to preserve','Referentna slika / šta sačuvati'],change:['Exact change','Tačna izmena'],checkpoint:['Checkpoint model','Checkpoint model'],duration:['Duration / seconds','Trajanje / sekunde'],camera:['Camera movement','Pokret kamere'],cut:['Cut style','Stil rezova'],sources:['Approved sources / source material','Odobreni izvori / izvorni materijal'],searchmode:['Research mode','Režim istraživanja'],trigger:['Trigger app + event','Aplikacija i događaj pokretanja'],actionapp:['Action app + action','Aplikacija i radnja'],mapping:['Data mapping','Mapiranje podataka'],original:['Original prompt','Originalni prompt'],operation:['Decompiler operation','Operacija dekompajlera'],modelLocal:['Local model name','Ime lokalnog modela']};
const common=[['model','select','gpt'],['answer','select','English'],['task','textarea',''],['role','text',''],['context','textarea',''],['format','select','Markdown'],['length','text','e.g., under 250 words']];
const specs={
general:{icon:'◈',name:['General prompt','Opšti prompt'],desc:['Fast, clear everyday task','Brz i jasan svakodnevni zadatak'],fields:[...common,['audience','text',''],['constraints','textarea','']]},
business:{icon:'▤',name:['Business writing','Poslovno pisanje'],desc:['Reports, emails, documents','Izveštaji, imejlovi, dokumenti'],fields:[...common,['audience','text',''],['tone','text','Professional and direct'],['success','textarea','']]},
project:{icon:'◫',name:['Complex project','Složen projekat'],desc:['Sequenced multi-step work','Rad u više koraka'],fields:[...common,['steps','textarea','1. \n2. \n3. '],['success','textarea',''],['constraints','textarea','']]},
creative:{icon:'✦',name:['Creative / brand','Kreativno / brend'],desc:['Voice, concepts, variants','Glas, koncepti, varijante'],fields:[...common,['tone','text',''],['audience','text',''],['success','textarea','Give 3 distinct variants']]},
analysis:{icon:'◌',name:['Analysis / debugging','Analiza / debagovanje'],desc:['Logic, comparison, diagnosis','Logika, poređenje, dijagnostika'],fields:[...common,['constraints','textarea',''],['success','textarea','']]},
fewshot:{icon:'≡',name:['Few-shot pattern','Few-shot obrazac'],desc:['Reliable structured output','Pouzdan strukturiran izlaz'],fields:[...common,['examples','textarea','INPUT: ... => OUTPUT: ...\nINPUT: ... => OUTPUT: ...'],['success','textarea','']]},
coding:{icon:'⌘',name:['Code edit','Izmena koda'],desc:['Cursor, Windsurf, Copilot','Cursor, Windsurf, Copilot'],fields:[['model','select','cursor'],['file','text','src/example.js'],['current','textarea',''],['desired','textarea',''],['scope','textarea','Only modify this file and component.'],['dont','textarea',''],['constraints','textarea','Language/framework and dependency limits'],['success','textarea','']]},
agent:{icon:'⚙',name:['Autonomous agent','Autonomni agent'],desc:['Claude Code, Devin, CLI agents','Claude Code, Devin, CLI agenti'],fields:[['model','select','claudeCode'],['task','textarea',''],['environment','textarea','OS: Windows\nShell: PowerShell\nWorking directory: '],['current','textarea',''],['desired','textarea',''],['scope','textarea','Read and edit only the stated folder.'],['dont','textarea','Do not push, deploy, or delete files.'],['stop','textarea','Pause before deletion, new APIs, dependencies, or after 2 failed attempts.'],['success','textarea','']]},
image:{icon:'◉',name:['Image generation','Generisanje slike'],desc:['Midjourney, DALL-E, Stable','Midjourney, DALL-E, Stable'],fields:[['model','select','midjourney'],['subject','text',''],['action','text',''],['setting','text',''],['style','text',''],['mood','text',''],['lighting','text',''],['palette','text',''],['composition','text',''],['aspect','text','16:9'],['negative','textarea','blurry, watermark, distortion']]},
imageEdit:{icon:'◐',name:['Image edit','Izmena slike'],desc:['Change one thing, preserve rest','Izmeni jedno, sačuvaj ostalo'],fields:[['model','select','dalle'],['reference','textarea',''],['change','textarea',''],['constraints','textarea','Keep style, lighting, and all listed elements unchanged.'],['negative','textarea','']]},
comfy:{icon:'▧',name:['ComfyUI','ComfyUI'],desc:['Positive / negative prompt','Pozitivan / negativan prompt'],fields:[['model','select','comfy'],['checkpoint','select','SDXL'],['subject','text',''],['style','text',''],['mood','text',''],['lighting','text',''],['composition','text',''],['negative','textarea','blurry, low quality, watermark'],['aspect','text','1024 x 1024']]},
video:{icon:'▷',name:['Video generation','Generisanje videa'],desc:['Sora, Runway, Kling','Sora, Runway, Kling'],fields:[['model','select','sora'],['subject','text',''],['action','text',''],['setting','text',''],['camera','text','slow dolly in'],['duration','text','8 seconds'],['mood','text',''],['lighting','text',''],['cut','text','single continuous shot'],['aspect','text','16:9']]},
research:{icon:'⌕',name:['Research','Istraživanje'],desc:['Search-grounded answers','Odgovori zasnovani na izvorima'],fields:[['model','select','perplexity'],['task','textarea',''],['searchmode','select','Search'],['sources','textarea',''],['audience','text',''],['format','select','Markdown'],['length','text','under 500 words'],['success','textarea','Cite the specific source for each factual claim.']]},
workflow:{icon:'⇄',name:['Workflow automation','Automatizacija'],desc:['Zapier, Make, n8n','Zapier, Make, n8n'],fields:[['model','select','zapier'],['trigger','text',''],['actionapp','text',''],['mapping','textarea',''],['constraints','textarea','Assumes listed apps are already connected.'],['success','textarea','List numbered steps and data passed between them.']]},
decompiler:{icon:'◇',name:['Prompt decompiler','Prompt dekompajler'],desc:['Break down, adapt, simplify','Razloži, prilagodi, pojednostavi'],fields:[['model','select','gpt'],['operation','select','Break down'],['original','textarea',''],['task','textarea',''],['format','select','Markdown']]}
};
const models={gpt:'ChatGPT / GPT-4o',reasoning:'OpenAI o1 / o3',claude:'Claude 4.x',gemini:'Gemini 2.x / 3 Pro',qwen:'Qwen 2.5 Instruct',qwenThinking:'Qwen3 Thinking',deepseek:'DeepSeek-R1',ollama:'Ollama',local:'Llama / Mistral',claudeCode:'Claude Code',cursor:'Cursor / Windsurf',copilot:'GitHub Copilot',bolt:'Bolt / v0 / Lovable',devin:'Devin / SWE-agent',perplexity:'Perplexity / SearchGPT',midjourney:'Midjourney',dalle:'DALL-E 3',stable:'Stable Diffusion',comfy:'ComfyUI',sora:'Sora / Runway / Kling',voice:'ElevenLabs / Murf',zapier:'Zapier / Make / n8n'};
const selects={model:Object.entries(models),answer:[['English','English'],['Serbian','Serbian'],['Both English and Serbian','English + Serbian']],format:[['Markdown','Markdown'],['Plain text','Plain text'],['JSON','JSON'],['XML','XML'],['Table','Table'],['Bullet points','Bullet points'],['Code / script','Code / script']],checkpoint:[['SD 1.5','SD 1.5'],['SDXL','SDXL'],['Flux','Flux']],searchmode:[['Search','Search'],['Analyze','Analyze'],['Compare','Compare']],operation:[['Break down','Break down'],['Adapt','Adapt'],['Simplify','Simplify'],['Split','Split']]};
function esc(s){return s.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}function title(key){return label[key]?.[lang==='en'?0:1]||key}
function renderTypes(){const el=$('types');el.innerHTML=Object.entries(specs).map(([k,s])=>'<button class="type '+(k===active?'on':'')+'" data-type="'+k+'"><b>'+s.icon+'</b><div><strong>'+s.name[lang==='en'?0:1]+'</strong><span>'+s.desc[lang==='en'?0:1]+'</span></div></button>').join('');el.querySelectorAll('.type').forEach(b=>b.onclick=()=>{active=b.dataset.type;render()})}
function input([key,kind,def]){let control;if(kind==='textarea')control='<textarea id="f-'+key+'" placeholder="'+esc(def)+'">'+esc(data[active]?.[key]??'')+'</textarea>';else if(kind==='select')control='<select id="f-'+key+'">'+selects[key].map(([v,n])=>'<option value="'+v+'" '+((data[active]?.[key]??def)===v?'selected':'')+'>'+n+'</option>').join('')+'</select>';else control='<input id="f-'+key+'" value="'+esc(data[active]?.[key]??'')+'" placeholder="'+esc(def)+'">';return '<div class="'+(['task','context','current','desired','constraints','success','examples','environment','sources','mapping','original','stop'].includes(key)?'full':'')+'"><label>'+title(key)+(def?'<small> · '+esc(def)+'</small>':'')+'</label>'+control+'</div>'}
function renderFields(){const s=specs[active];$('formTitle').textContent=s.name[lang==='en'?0:1];$('formIntro').textContent=s.desc[lang==='en'?0:1];$('fields').innerHTML=s.fields.map(input).join('');$('fields').querySelectorAll('input,textarea,select').forEach(el=>el.addEventListener('input',()=>{data[active]??={};data[active][el.id.slice(2)]=el.value;build()}))}
function val(k){return String(data[active]?.[k]??$('f-'+k)?.value??'').trim()}const row=(k,n=k)=>val(k)?n+': '+val(k):'';function examples(){return val('examples')?'<examples>\n'+val('examples').split('\n').filter(Boolean).map((x,i)=>'  <example id="'+(i+1)+'">'+x+'</example>').join('\n')+'\n</examples>':''}
function modelRule(m){return {gpt:'Use a strong role, numbered instructions, numeric limits, and exact output format. Skip preamble. No caveats. Answer directly.',reasoning:'Use a short direct instruction. Solve internally and output only the final answer. Do not show reasoning.',claude:'Use the tagged sections faithfully. Keep solutions minimal. Only make changes directly requested.',gemini:'Base the response only on supplied context. Cite only sources you are certain of. Mark uncertainty as [uncertain].',qwen:'Use a clear role and explicit output format. Keep the prompt focused and state output language.',qwenThinking:'Use a short direct instruction. Reason internally and output only the final answer.',deepseek:'Use a short direct instruction. Output only the final answer, without reasoning or think tags.',ollama:'Use a simple flat prompt. The selected local model must be specified before use.',local:'Use a short flat prompt with a clear role. Avoid deep nesting and complex multi-step instructions.',claudeCode:'Follow the agent scope, forbidden actions, stop conditions, and checkpoints exactly.',cursor:'Edit only the stated file and component. Preserve all listed contracts. Stop when Done When is met.',copilot:'Write the requested function contract, types, edge cases, and forbidden behavior as a focused instruction.',bolt:'Build only the named deliverable. Do not add authentication, dark mode, or unrequested features.',devin:'Respect explicit starting state, target state, forbidden actions, and stop conditions.',perplexity:'Use the requested research mode. Report only what verified results support and cite every factual claim.',midjourney:'Return comma-separated visual descriptors. Subject first; style, mood, lighting, composition next; parameters last.',dalle:'Use a clear prose image description. Describe foreground, midground, background; exclude text unless requested.',stable:'Use weighted prompt syntax when useful and always include a separate negative prompt.',comfy:'Return separate POSITIVE PROMPT and NEGATIVE PROMPT blocks, plus checkpoint and generation settings.',sora:'Specify subject, camera movement, duration, mood, and cut style.',voice:'Specify emotion, pacing, emphasis, pauses, and speech rate.',zapier:'Return numbered trigger-to-action steps and explicit field mapping.'}[m]||''}
function build(){let m=val('model')||'gpt',task=val('task')||val('desired')||val('subject')||'[Describe the task]';let a=[];if(active==='coding')a=['File: '+val('file'),'Function/Component: [specify if applicable]','Current Behavior: '+val('current'),'Desired Change: '+val('desired'),'Scope: '+val('scope'),'Do NOT touch: '+val('dont'),'Constraints: '+val('constraints'),'Done When: '+val('success')].filter(Boolean);else if(active==='agent')a=['## Objective\n'+task,'## Environment\n'+val('environment'),'## Starting State\n'+val('current'),'## Target State\n'+val('desired'),'## Allowed Actions\n'+val('scope'),'## Forbidden Actions\n'+val('dont'),'## Stop Conditions\n'+val('stop'),'## Checkpoints\nAfter each major step output: ✅ [what was completed].','## Done When\n'+val('success')].filter(Boolean);else if(active==='image')a=[val('subject'),val('action'),val('setting'),val('style'),val('mood'),val('lighting'),val('palette'),val('composition'),'--ar '+val('aspect'),val('negative')?'--no '+val('negative'):''].filter(Boolean);else if(active==='imageEdit')a=['Reference image: '+val('reference'),'What to change: '+val('change'),'What to keep exactly the same: '+val('constraints'),'Negative prompt: '+val('negative')].filter(Boolean);else if(active==='comfy')a=['POSITIVE PROMPT:\n'+[val('subject'),val('style'),val('mood'),val('lighting'),val('composition')].filter(Boolean).join(', '),'NEGATIVE PROMPT:\n'+val('negative'),'CHECKPOINT: '+val('checkpoint'),'RESOLUTION: '+val('aspect'),'SAMPLER: Euler a\nCFG SCALE: 7\nSTEPS: 20-30'];else if(active==='video')a=[val('subject'),val('action'),val('setting'),'Camera: '+val('camera'),'Duration: '+val('duration'),'Mood: '+val('mood'),'Lighting: '+val('lighting'),'Cut style: '+val('cut'),'Aspect ratio: '+val('aspect')].filter(Boolean);else if(active==='workflow')a=['Trigger: '+val('trigger'),'Action: '+val('actionapp'),'Data mapping: '+val('mapping'),'Constraints: '+val('constraints'),'Done when: '+val('success')].filter(Boolean);else if(active==='decompiler')a=['Original prompt:\n'+val('original'),'Operation: '+val('operation'),'Task: '+task,'Output format: '+val('format')].filter(Boolean);else a=[row('role','Role'),row('context','Context'),row('audience','Audience'),'Task: '+task,row('steps','Steps'),row('tone','Tone'),row('constraints','Constraints'),row('sources','Sources'),row('success','Success criteria'),'Output language: '+val('answer'),'Output format: '+val('format'),'Maximum length: '+val('length'),examples()].filter(Boolean);
if(active==='analysis'&&!['reasoning','qwenThinking','deepseek'].includes(m))a.splice(1,0,'Analyze the problem carefully before answering.');if(active==='research')a.push('Use only verified information from the approved sources. If a claim is uncertain, write [uncertain].');let out;if(m==='claude'&&!['image','comfy'].includes(active))out='<role>'+esc(val('role')||'Expert assistant')+'</role>\n<task>'+esc(task)+'</task>\n<context>'+esc(val('context'))+'</context>\n<constraints>'+esc(val('constraints')+'\nOutput format: '+val('format')+'\nMaximum length: '+val('length'))+'</constraints>\n<output_format>'+esc(val('success')||val('format'))+'</output_format>\n'+examples();else out=[modelRule(m),'',...a].filter(Boolean).join('\n\n');$('output').textContent=out;$('modelBadge').textContent=models[m]||m;$('note').textContent='Profile: '+(active==='analysis'&&['reasoning','qwenThinking','deepseek'].includes(m)?'Reasoning-safe — no explicit chain-of-thought.':models[m]||m)}
function render(){renderTypes();renderFields();build()}function setLang(l){lang=l;let q=L[l];$('tagline').textContent=q.tag;$('clearT').textContent=q.clear;$('typeT').textContent=q.type;$('modeT').textContent=q.mode;$('copyT').textContent=q.copy;$('downloadT').textContent=q.down;$('previewT').textContent=q.prev;$('previewH').textContent=q.opt;document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('on',x.dataset.lang===l));render()}
$('copy').onclick=async()=>{await navigator.clipboard.writeText($('output').textContent);$('status').textContent=L[lang].copied};$('download').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('output').textContent],{type:'text/plain'}));a.download='optimized-prompt.txt';a.click();$('status').textContent=L[lang].downloaded};$('clear').onclick=()=>{data[active]={};$('status').textContent='';render()};document.querySelectorAll('[data-lang]').forEach(x=>x.onclick=()=>setLang(x.dataset.lang));render();
</script></body></html>
